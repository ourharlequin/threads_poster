services:
  merger:
    build:
      context: ./superset
      dockerfile: Dockerfile.merger
    container_name: threads_merger
    restart: always
    environment:
      - TZ=Europe/Belgrade
    volumes:
      - ./Budimir/data:/app/data/budimir:ro
      - ./Slava/data:/app/data/slava:ro
      - ./Tanya/data:/app/data/tanya:ro
      - ./data:/app/data/analytics

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    container_name: threads_superset
    restart: always
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-change-me-in-production}
      - SUPERSET_ADMIN_USER=${SUPERSET_ADMIN_USER:-admin}
      - SUPERSET_ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD:-admin}
      - SUPERSET_ADMIN_EMAIL=${SUPERSET_ADMIN_EMAIL:-admin@threads.local}
      - REDIS_HOST=superset_redis
    volumes:
      - ./data:/app/data/analytics
      - superset_home:/app/superset_home
    depends_on:
      - superset_redis
      - merger

  superset_redis:
    image: redis:7-alpine
    container_name: threads_superset_redis
    restart: always
    volumes:
      - superset_redis_data:/data

volumes:
  superset_home:
  superset_redis_data:
