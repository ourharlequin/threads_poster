services:
  threads_publisher:
    build: .
    container_name: budimir_publisher
    restart: always
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - ./data:/app/data

  threads_scheduler:
    build: .
    container_name: budimir_scheduler
    restart: always
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Belgrade
    volumes:
      - .:/app
      - ./data:/app/data
    entrypoint: ["python", "scheduler.py"]

  threads_generator:
    build: .
    container_name: threads_generator
    profiles: ["tools"]
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - ./data:/app/data
    entrypoint: ["python", "generate_posts.py"]
    # Usage: docker-compose --profile tools run --rm threads_generator --account event_parsing

  threads_refresher:
    build: .
    container_name: threads_refresher
    profiles: ["tools"]
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    entrypoint: ["python", "refresh_tokens.py"]
    # Usage: docker-compose --profile tools run --rm threads_refresher
