services:
  threads_publisher:
    build: .
    container_name: tanya_publisher
    restart: always
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - ./data:/app/data
  threads_scheduler:
    build: .
    container_name: tanya_scheduler
    restart: always
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Belgrade
      - REDDIT_DB_PATH=/reddit_trends/data/reddit.duckdb
    volumes:
      - .:/app
      - ./data:/app/data
      - ../reddit_trends:/reddit_trends
    entrypoint: ["python", "scheduler.py"]
  threads_generator:
    build: .
    container_name: tanya_generator
    profiles: ["tools"]
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDDIT_DB_PATH=/reddit_trends/data/reddit.duckdb
    volumes:
      - .:/app
      - ./data:/app/data
      - ../reddit_trends:/reddit_trends
    entrypoint: ["python", "generate_posts.py"]
    # Usage: docker-compose --profile tools run --rm threads_generator --account tatiana.philosophy.eng
  threads_refresher:
    build: .
    container_name: tanya_refresher
    profiles: ["tools"]
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    entrypoint: ["python", "refresh_tokens.py"]
    # Usage: docker-compose --profile tools run --rm threads_refresher
